server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA + rotas do React Navigation (ex.: /Auth/EscolhaPerfil): tudo cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker nunca deve ser cacheado agressivamente.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Assets com hash: cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
